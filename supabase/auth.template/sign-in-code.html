<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
<head>
    <meta content="width=device-width" name="viewport"/>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
    <meta name="x-apple-disable-message-reformatting"/>
    <meta content="telephone=no,address=no,email=no,date=no,url=no" name="format-detection"/>
</head>
<body dir="ltr" lang="en" style="background-color:#f6f7f9;margin:0;padding:0">
<table border="0" width="100%" cellPadding="0" cellSpacing="0" role="presentation" style="background-color:#f6f7f9">
    <tbody>
    <tr>
        <td style="padding:24px">
            <table align="left" width="100%" border="0" cellPadding="0" cellSpacing="0" role="presentation"
                   style="max-width:600px;width:100%;color:#222222;background-color:#ffffff;border-radius:12px">
                <tbody>
                <tr>
                    <td style="padding:32px">
                        <h2 style="margin:0 0 20px;padding:0;font-size:24px">Your Muster sign-in code</h2>
                        <p style="margin:0 0 12px;padding:0;font-size:16px;line-height:1.6">Enter this code in Muster to sign in:</p>
                        <p style="margin:0 0 20px;padding:16px;font-size:28px;line-height:1.2;letter-spacing:6px;font-weight:600;text-align:center;background-color:#f3f4f6;border-radius:8px">
                            {{ .Token }}</p>
                        <p style="margin:0 0 32px;padding:0;font-size:14px;line-height:1.6;color:#666">If you didn&#x27;t try to sign in to Muster,
                            you can safely ignore this email.</p>
                        <hr style="width:100%;border:0;border-top:1px solid #e5e7eb;margin:0 0 20px"/>
                        <p style="margin:0;padding:0;font-size:12px;color:#999">© Muster</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
