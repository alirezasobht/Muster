name: Prepare release
run-name: Prepare release from ${{ inputs.base }}

on:
    workflow_dispatch:
        inputs:
            base:
                description: Branch to release
                required: true
                default: dev
            version:
                description: Next version (x.y.z), only if the branch isn't bumped yet
                required: false

jobs:
    prepare:
        name: Prepare
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/create-github-app-token@v2
              id: app
              with:
                  app-id: ${{ vars.MUSTER_RELEASE_APP_ID }}
                  private-key: ${{ secrets.MUSTER_RELEASE_APP_KEY }}

            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.base }}
                  fetch-depth: 0
                  token: ${{ steps.app.outputs.token }}

            - env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  BASE: ${{ inputs.base }}
                  VERSION: ${{ inputs.version }}
                  BOT: ${{ steps.app.outputs.app-slug }}[bot]
              run: |
                  set -eu
                  name() { grep '^VERSION_NAME=' | cut -d= -f2 | tr -d '[:space:]'; }
                  above() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

                  [ "$BASE" != main ] || { echo "base can't be main" >&2; exit 1; }
                  main=$(git show origin/main:version.properties | name)
                  current=$(name < version.properties)

                  if above "$current" "$main"; then
                      [ -z "$VERSION" ] || [ "$VERSION" = "$current" ] \
                          || { echo "$BASE already has $current; leave version empty" >&2; exit 1; }
                      version=$current
                  else
                      [ -n "$VERSION" ] \
                          || { echo "$BASE has $current, main has $main: enter the next version" >&2; exit 1; }
                      echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
                          || { echo "version must be x.y.z" >&2; exit 1; }
                      above "$VERSION" "$main" \
                          || { echo "$VERSION is not above main's $main" >&2; exit 1; }
                      version=$VERSION
                      sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$version/" version.properties
                      id=$(gh api "/users/$BOT" --jq .id)
                      git config user.name "$BOT"
                      git config user.email "${id}+${BOT}@users.noreply.github.com"
                      git commit -am "Bump version to $version"
                      git push origin "HEAD:$BASE"
                  fi

                  gh pr create --base main --head "$BASE" \
                      --title "Release $version" \
                      --body "Release $version from \`$BASE\`."
