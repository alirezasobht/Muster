# On every push to main, each job after approval: back up and
# deploy the backend, then web to Cloudflare, Android to Play and iOS
# to TestFlight.
name: Deploy prod

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-prod
    cancel-in-progress: false

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-latest
        environment: prod
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
            PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        steps:
            - uses: actions/checkout@v5
            - uses: supabase/setup-cli@v1
              with:
                  version: latest
            - run: sudo apt-get install -y age

            - name: Link
              run: supabase link --project-ref "$PROJECT_REF"

            - name: Back up
              env:
                  AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
              run: |
                  set -eu
                  mkdir dump
                  supabase db dump --linked --role-only -f dump/roles.sql
                  supabase db dump --linked -f dump/schema.sql
                  supabase db dump --linked --data-only --use-copy -f dump/data.sql
                  for f in roles schema data; do
                      [ -s "dump/$f.sql" ] || { echo "empty $f.sql: the dump failed" >&2; exit 1; }
                  done
                  tar -czf - -C dump . | age -r "$AGE_PUBLIC_KEY" > backup.tar.gz.age
                  rm -rf dump

            - name: Store backup
              env:
                  BACKUPS_TOKEN: ${{ secrets.MUSTER_BACKUPS_TOKEN }}
              run: |
                  set -eu
                  stamp=$(date -u +%Y%m%d-%H%M%S)
                  git clone --depth 1 \
                      "https://x-access-token:${BACKUPS_TOKEN}@github.com/alirezasobht/Muster-backups.git" backups
                  mkdir -p backups/prod
                  mv backup.tar.gz.age "backups/prod/${stamp}-${GITHUB_SHA::7}.tar.gz.age"
                  cd backups
                  git config user.name "github-actions"
                  git config user.email "github-actions@users.noreply.github.com"
                  git add prod
                  git commit -m "prod ${stamp}"
                  git push

            - name: Push migrations
              run: supabase db push --linked --yes

            - name: Push Edge Function secrets
              env:
                  ALL_SECRETS: ${{ toJSON(secrets) }}
              run: |
                  set -eu
                  echo "$ALL_SECRETS" | jq -r '
                      to_entries[]
                      | select(.key | startswith("PROD_EDGE_"))
                      | "\(.key | sub("^PROD_EDGE_"; ""))=\(.value | @json)"' > edge.env
                  [ -s edge.env ] || { echo "no PROD_EDGE_ secrets in the prod environment" >&2; exit 1; }
                  supabase secrets set --env-file edge.env --project-ref "$PROJECT_REF"

                  existing=$(supabase secrets list --project-ref "$PROJECT_REF" -o json \
                      | jq -r '.[].name' | grep -v '^SUPABASE_' || true)
                  wanted=$(cut -d= -f1 edge.env)
                  stale=""
                  for name in $existing; do
                      echo "$wanted" | grep -qx "$name" || stale="$stale $name"
                  done
                  [ -z "$stale" ] || supabase secrets unset $stale --project-ref "$PROJECT_REF"
                  rm -f edge.env

            - name: Deploy functions
              run: |
                  set -eu
                  for dir in supabase/functions/*/; do
                      name=$(basename "$dir")
                      case "$name" in _*) continue ;; esac
                      supabase functions deploy "$name" --project-ref "$PROJECT_REF"
                  done

    web:
        name: Web
        needs: backend
        runs-on: ubuntu-latest
        environment: prod
        env:
            SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            WEB_APP_URL: ${{ secrets.PROD_WEB_APP_URL }}
            CONTACT_EMAIL: ${{ secrets.PROD_CONTACT_EMAIL }}
            ANDROID_CERT_SHA256: ${{ secrets.PROD_ANDROID_CERT_SHA256 }}
            IOS_APP_STORE_ID: ${{ secrets.PROD_IOS_APP_STORE_ID }}
            IOS_TEAM_ID: ${{ secrets.PROD_IOS_TEAM_ID }}
            MUSTER_ENV: prod
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew :webApp:composeCompatibilityBrowserDistribution
            - uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.PROD_CLOUDFLARE_ACCOUNT_ID }}
                  command: >-
                      pages deploy webApp/build/dist/composeWebCompatibility/productionExecutable
                      --project-name=${{ secrets.PROD_CLOUDFLARE_PAGES_PROJECT }}
                      --branch=main
                      --commit-hash=${{ github.sha }}

    android:
        name: Android
        needs: backend
        runs-on: ubuntu-latest
        environment: prod
        env:
            SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            WEB_APP_URL: ${{ secrets.PROD_WEB_APP_URL }}
            CONTACT_EMAIL: ${{ secrets.PROD_CONTACT_EMAIL }}
            MUSTER_ENV: prod
            UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PROD_UPLOAD_KEYSTORE_PASSWORD }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v4

            - name: Restore keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.PROD_UPLOAD_KEYSTORE_BASE64 }}
              run: |
                  set -eu
                  printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
                  echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

            - run: ./gradlew :androidApp:bundleRelease

            - uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.PROD_PLAY_SERVICE_ACCOUNT_JSON }}
                  packageName: app.muster.prod
                  releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
                  track: internal
                  status: completed

    ios:
        name: iOS
        needs: backend
        runs-on: macos-latest
        environment: prod
        env:
            SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            WEB_APP_URL: ${{ secrets.PROD_WEB_APP_URL }}
            CONTACT_EMAIL: ${{ secrets.PROD_CONTACT_EMAIL }}
            MUSTER_ENV: prod
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: actions/cache@v4
              with:
                  path: ~/.konan
                  key: konan-${{ hashFiles('gradle/libs.versions.toml') }}
            - uses: gradle/actions/setup-gradle@v4

            # Config.xcconfig includes ../Muster-env/prod/ios.xcconfig for
            # the Team ID and web host.
            - name: Signing
              env:
                  XCCONFIG: ${{ secrets.PROD_IOS_XCCONFIG }}
                  P12: ${{ secrets.PROD_IOS_P12_BASE64 }}
                  P12_PASSWORD: ${{ secrets.PROD_IOS_P12_PASSWORD }}
                  PROFILE: ${{ secrets.PROD_IOS_PROFILE_BASE64 }}
              run: |
                  set -eu
                  mkdir -p ../Muster-env/prod
                  printf '%s\n' "$XCCONFIG" > ../Muster-env/prod/ios.xcconfig

                  keychain="$RUNNER_TEMP/signing.keychain-db"
                  password=$(uuidgen)
                  security create-keychain -p "$password" "$keychain"
                  security set-keychain-settings -lut 21600 "$keychain"
                  security unlock-keychain -p "$password" "$keychain"
                  printf '%s' "$P12" | base64 -d > "$RUNNER_TEMP/distribution.p12"
                  security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$P12_PASSWORD" \
                      -T /usr/bin/codesign -T /usr/bin/security
                  rm "$RUNNER_TEMP/distribution.p12"
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
                  security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

                  profile="$RUNNER_TEMP/profile.mobileprovision"
                  printf '%s' "$PROFILE" | base64 -d > "$profile"
                  uuid=$(security cms -D -i "$profile" | plutil -extract UUID raw -)
                  for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                             "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
                      mkdir -p "$dir"
                      cp "$profile" "$dir/$uuid.mobileprovision"
                  done

            - name: Archive
              run: |
                  xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
                      -configuration Release -destination 'generic/platform=iOS' \
                      -archivePath "$RUNNER_TEMP/Muster.xcarchive" archive

            - name: Export
              id: export
              env:
                  TEAM_ID: ${{ secrets.PROD_IOS_TEAM_ID }}
              run: |
                  set -eu
                  cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key><string>app-store-connect</string>
                      <key>teamID</key><string>${TEAM_ID}</string>
                      <key>signingStyle</key><string>manual</string>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>app.muster.prod</key><string>Muster App Store</string>
                      </dict>
                  </dict>
                  </plist>
                  PLIST
                  xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Muster.xcarchive" \
                      -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                      -exportPath "$RUNNER_TEMP/export"
                  echo "ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)" >> "$GITHUB_OUTPUT"

            - uses: apple-actions/upload-testflight-build@v3
              with:
                  app-path: ${{ steps.export.outputs.ipa }}
                  issuer-id: ${{ secrets.PROD_ASC_ISSUER_ID }}
                  api-key-id: ${{ secrets.PROD_ASC_KEY_ID }}
                  api-private-key: ${{ secrets.PROD_ASC_KEY }}

            - name: Remove keychain
              if: always()
              run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
