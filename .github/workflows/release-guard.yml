# Closes PRs into main opened by anyone but the owner or the release app.
name: Release guard

on:
    pull_request_target:
        branches: [main]
        types: [opened, reopened]

permissions:
    pull-requests: write

jobs:
    close:
        name: Owner only
        if: >-
            github.event.pull_request.user.login != github.repository_owner
            && github.event.pull_request.user.login != 'muster-release-alirezasobht[bot]'
        runs-on: ubuntu-latest
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.html_url }}
              run: |
                  gh pr close "$PR" --comment "Pull requests into main come only from the maintainer. Please target dev instead."
