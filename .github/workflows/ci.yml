name: CI

on:
    pull_request:
        branches: [dev, main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    SUPABASE_URL: https://ci.invalid
    SUPABASE_PUBLISHABLE_KEY: ci
    WEB_APP_URL: https://ci.invalid
    CONTACT_EMAIL: ci@ci.invalid

jobs:
    ktlint:
        name: Ktlint Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew ktlintCheck

    unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug

    android:
        name: Android Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v4
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  script: ./gradlew :shared:connectedAndroidDeviceTest

    web:
        name: Web Build
        runs-on: ubuntu-latest
        env:
            SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
            SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
            WEB_APP_URL: ${{ secrets.DEV_WEB_APP_URL }}
            CONTACT_EMAIL: ${{ secrets.DEV_CONTACT_EMAIL }}
            MUSTER_ENV: dev
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew :webApp:composeCompatibilityBrowserDistribution
            - uses: actions/upload-artifact@v4
              with:
                  name: web-dev-pr${{ github.event.pull_request.number }}
                  path: webApp/build/dist/composeWebCompatibility/productionExecutable
                  retention-days: 14

    ios:
        name: iOS Tests
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - uses: actions/cache@v4
              with:
                  path: ~/.konan
                  key: konan-${{ hashFiles('gradle/libs.versions.toml') }}
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew :shared:iosSimulatorArm64Test
